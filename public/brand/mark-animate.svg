<svg width="240" height="242" viewBox="-30 -30 240 242" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ~2.4s cycle: the ring turns clockwise while the dot orbits the
       other way, both landing back on the rest pose for a short pause. */
    .ring, .dot {
      transform-box: view-box;
      transform-origin: 90px 91px;
      animation-duration: 2.4s;
      animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      animation-iteration-count: infinite;
    }
    .ring { animation-name: turn; }
    .dot { animation-name: orbit; }
    @keyframes turn {
      0% { transform: rotate(0deg); }
      80%, 100% { transform: rotate(360deg); }
    }
    @keyframes orbit {
      0% { transform: rotate(0deg) scale(1); }
      40% { transform: rotate(-180deg) scale(0.8); }
      80%, 100% { transform: rotate(-360deg) scale(1); }
    }
  </style>
  <path class="ring" d="M156.26 75.70A68 68 0 1 1 105.30 24.74" stroke="black" stroke-width="26" stroke-linecap="round"/>
  <circle class="dot" cx="105.56" cy="75.44" r="20" fill="black"/>
</svg>
