<svg width="240" height="242" viewBox="-30 -30 240 242" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ~2.4s cycle: a quick cascade around the ring, then a beat of rest. */
    .t {
      transform-box: fill-box;
      transform-origin: center;
      animation: turn 2.4s cubic-bezier(0.55, 0, 0.3, 1) infinite;
    }
    @keyframes turn {
      0% { translate: 0 0; scale: 1; }
      30% { translate: var(--dx) var(--dy); scale: 1.18; }
      60%, 100% { translate: 0 0; scale: 1; }
    }
    .t0 { animation-delay: 0.000s; }
    .t1 { animation-delay: 0.045s; }
    .t2 { animation-delay: 0.090s; }
    .t3 { animation-delay: 0.135s; }
    .t4 { animation-delay: 0.180s; }
    .t5 { animation-delay: 0.225s; }
    .t6 { animation-delay: 0.270s; }
    .t7 { animation-delay: 0.315s; }
  </style>
  <g fill="black">
  <circle class="t t0" style="--dx:0.00px;--dy:-7.00px" cx="90.00" cy="31.00" r="6.50"/>
  <circle class="t t1" style="--dx:4.95px;--dy:-4.95px" cx="132.43" cy="48.57" r="8.00"/>
  <circle class="t t2" style="--dx:7.00px;--dy:0.00px" cx="150.00" cy="91.00" r="9.50"/>
  <circle class="t t3" style="--dx:4.95px;--dy:4.95px" cx="132.43" cy="133.43" r="11.00"/>
  <circle class="t t4" style="--dx:0.00px;--dy:7.00px" cx="90.00" cy="151.00" r="12.50"/>
  <circle class="t t5" style="--dx:-4.95px;--dy:4.95px" cx="47.57" cy="133.43" r="14.00"/>
  <circle class="t t6" style="--dx:-7.00px;--dy:0.00px" cx="30.00" cy="91.00" r="15.50"/>
  <circle class="t t7" style="--dx:-4.95px;--dy:-4.95px" cx="47.57" cy="48.57" r="17.00"/>
  </g>
</svg>
